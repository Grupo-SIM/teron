  hulypulse:
    image: jbmidia/teron_hulypulse:latest
    environment:
      - HULY_BIND_PORT=8099
      - HULY_LOG=info
      - HULY_TOKEN_SECRET=${SECRET}
      - HULY_HEARTBEAT_TIMEOUT=60
      - HULY_BACKEND=memory
      # For Redis backend instead of in-memory (optional, e.g. multi-node setups):
      # - HULY_BACKEND=redis
      # - HULY_REDIS_MODE=direct
      # - HULY_REDIS_URLS=redis://redis:6379
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.http.routers.huly-pulse.entrypoints=websecure
        - traefik.http.routers.huly-pulse.rule=Host(`${HOST_ADDRESS}`) && PathPrefix(`/_pulse`)
        - traefik.http.routers.huly-pulse.tls=true
        - traefik.http.routers.huly-pulse.tls.certresolver=le
        - traefik.http.routers.huly-pulse.middlewares=huly-strip-pulse
        - traefik.http.middlewares.huly-strip-pulse.stripprefix.prefixes=/_pulse
        - traefik.http.services.huly-pulse.loadbalancer.passHostHeader=true
        - traefik.http.services.huly-pulse.loadbalancer.server.port=8099

  kvs:
    image: hardcoreeng/hulykvs:${HULY_VERSION}
    environment:
      - HULY_DB_CONNECTION=${CR_DB_URL}
      - HULY_TOKEN_SECRET=${SECRET}
    ports:
      - target: 8094
        published: 8094
        protocol: tcp
        mode: ingress
    networks:
      - interna
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  livekit:
    image: livekit/livekit-server:latest
    environment:
      - "LIVEKIT_KEYS=devkey: secret"
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        # Traefik cuidando da porta 7880 (Sinalização WebSocket segura)
        - traefik.enable=true
        - traefik.http.routers.huly-livekit.entrypoints=websecure
        - traefik.http.routers.huly-livekit.rule=Host(`livekit.jbmidia.com`)
        - traefik.http.routers.huly-livekit.tls=true
        - traefik.http.routers.huly-livekit.tls.certresolver=le
        - traefik.http.routers.huly-livekit.tls.domains[0].main=livekit.jbmidia.com
        - traefik.http.services.huly-livekit.loadbalancer.server.port=7880
        - traefik.http.services.huly-livekit.loadbalancer.passHostHeader=true

  love:
    image: jbmidia/teron_love:latest
    environment:
      - PORT=8096
      - SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - ACCOUNTS_URL=http://account:3000
      - LIVEKIT_HOST=https://livekit.jbmidia.com
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.huly-love.entrypoints=websecure
        - traefik.http.routers.huly-love.rule=Host(`${HOST_ADDRESS}`) && PathPrefix(`/_love`)
        - traefik.http.routers.huly-love.tls=true
        - traefik.http.routers.huly-love.tls.certresolver=le
        - traefik.http.routers.huly-love.middlewares=huly-strip-love
        - traefik.http.middlewares.huly-strip-love.stripprefix.prefixes=/_love
        - traefik.http.services.huly-love.loadbalancer.passHostHeader=true
        - traefik.http.services.huly-love.loadbalancer.server.port=8096

  mail:
    image: jbmidia/teron_mail:latest
    environment:
      - PORT=8097
      - SOURCE=${EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    ports:
      - 8097:8097
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  minio:
    image: "minio/minio"
    volumes:
      - ${VOLUME_FILES_PATH:-files}:/data
    networks:
      - interna
      - externa
    command: server /data --address ":9000" --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  mongodb:
    image: mongo:7-jammy
    volumes:
      - ${VOLUME_MONGO_PATH:-mongodb}:/data/db
    networks:
      - externa
      - interna
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  # redis:
  #   image: redis:7-alpine
  #   command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
  #   restart: unless-stopped
  #   networks:
