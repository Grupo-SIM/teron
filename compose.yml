  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    volumes:
      - ${VOLUME_CR_DATA_PATH:-cr_data}:/cockroach/cockroach-data
      - ${VOLUME_CR_CERTS_PATH:-cr_certs}:/cockroach/certs
    environment:
      - COCKROACH_DATABASE=${CR_DATABASE}
      - COCKROACH_USER=${CR_USERNAME}
      - COCKROACH_PASSWORD=${CR_USER_PASSWORD}
    ports:
      - 26257:26257
    networks:
      - interna
    command: start-single-node --accept-sql-without-tls
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  collaborator:
    image: jbmidia/teron_collaborator:latest
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.huly-collaborator.entrypoints=websecure
        - traefik.http.routers.huly-collaborator.rule=Host(`${HOST_ADDRESS}`) && PathPrefix(`/_collaborator`)
        - traefik.http.routers.huly-collaborator.tls=true
        - traefik.http.routers.huly-collaborator.tls.certresolver=le
        - traefik.http.routers.huly-collaborator.middlewares=huly-strip-collaborator
        - traefik.http.middlewares.huly-strip-collaborator.stripprefix.prefixes=/_collaborator
        - traefik.http.services.huly-collaborator.loadbalancer.passHostHeader=true
        - traefik.http.services.huly-collaborator.loadbalancer.server.port=3078

  elastic:
    image: "elasticsearch:7.14.2"
    volumes:
      - ${VOLUME_ELASTIC_PATH:-elastic}:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    ports:
      - 9200:9200
    networks:
      - interna
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  front:
    image: jbmidia/teron_front:latest
    environment:
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - ACCOUNTS_URL=https://${HOST_ADDRESS}/_accounts
      - CALENDAR_URL=https://${HOST_ADDRESS}/_calendar
      - COLLABORATOR_URL=wss://${HOST_ADDRESS}/_collaborator
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_CHANNEL}
      - ELASTIC_INDEX_NAME=huly_storage_index
      - ELASTIC_URL=http://elastic:9200
      - GITHUB_APP=teron-gestao-de-equipes
      - GITHUB_CLIENTID=Ov23liCxLZ4IRJfzpRo1
      - GITHUB_URL=https://${HOST_ADDRESS}/_github
      - GMAIL_URL=https://${HOST_ADDRESS}/_gmail
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - LIVEKIT_WS=wss://livekit.jbmidia.com
      - LOVE_ENDPOINT=https://${HOST_ADDRESS}/_love
      - PULSE_URL=https://${HOST_ADDRESS}/_pulse/ws
      - REKONI_URL=https://${HOST_ADDRESS}/_rekoni
      - SERVER_PORT=8080
      - SERVER_SECRET=${SECRET}
      - STATS_URL=https://${HOST_ADDRESS}/_stats
      #      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - TELEGRAM_BOT_URL=https://${HOST_ADDRESS}/_telegram
      - TELEGRAM_URL=https://${HOST_ADDRESS}/_telegram-personal
      - TITLE=${TITLE:-Huly Self Host}
      - UPLOAD_URL=/files
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.huly-front.entrypoints=websecure
        - traefik.http.routers.huly-front.rule=Host(`${HOST_ADDRESS}`)
        - traefik.http.routers.huly-front.tls=true
        - traefik.http.routers.huly-front.tls.certresolver=le
        - traefik.http.routers.huly-front.priority=1
        - traefik.http.services.huly-front.loadbalancer.passHostHeader=true
        - traefik.http.services.huly-front.loadbalancer.server.port=8080

  fulltext:
    image: jbmidia/teron_fulltext:latest
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    networks:
      - interna
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

