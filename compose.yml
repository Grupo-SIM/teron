  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    volumes:
      - ${VOLUME_REDPANDA_PATH:-redpanda}:/var/lib/redpanda/data
    environment:
      - REDPANDA_SUPERUSER_USERNAME=${REDPANDA_ADMIN_USER}
      - REDPANDA_SUPERUSER_PASSWORD=${REDPANDA_ADMIN_PWD}
    networks:
      interna:
        aliases:
          - redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --default-log-level=info
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
        # ["rpk", "cluster", "info", "-X", "user=${REDPANDA_ADMIN_USER}", "-X", "pass=${REDPANDA_ADMIN_PWD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  rekoni:
    image: jbmidia/teron_rekoni-service:latest
    environment:
      - SECRET=${SECRET}
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 500M
      labels:
        - traefik.enable=true
        - traefik.http.routers.huly-rekoni.entrypoints=websecure
        - traefik.http.routers.huly-rekoni.rule=Host(`${HOST_ADDRESS}`) && PathPrefix(`/_rekoni`)
        - traefik.http.routers.huly-rekoni.tls=true
        - traefik.http.routers.huly-rekoni.tls.certresolver=le
        - traefik.http.routers.huly-rekoni.middlewares=huly-strip-rekoni
        - traefik.http.middlewares.huly-strip-rekoni.stripprefix.prefixes=/_rekoni
        - traefik.http.services.huly-rekoni.loadbalancer.passHostHeader=true
        - traefik.http.services.huly-rekoni.loadbalancer.server.port=4004

  stats:
    image: jbmidia/teron_stats:latest
    environment:
      - PORT=4900
      - SERVER_SECRET=${SECRET}
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.huly-stats.entrypoints=websecure
        - traefik.http.routers.huly-stats.rule=Host(`${HOST_ADDRESS}`) && PathPrefix(`/_stats`)
        - traefik.http.routers.huly-stats.tls=true
        - traefik.http.routers.huly-stats.tls.certresolver=le
        - traefik.http.routers.huly-stats.middlewares=huly-strip-stats
        - traefik.http.middlewares.huly-strip-stats.stripprefix.prefixes=/_stats
        - traefik.http.services.huly-stats.loadbalancer.passHostHeader=true
        - traefik.http.services.huly-stats.loadbalancer.server.port=4900

  telegram-personal:
    image: jbmidia/teron_telegram:latest
    environment:
      - ACCOUNTS_URL=http://account:3000
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=telegram-service
      - PORT=8086
      - SECRET=${SECRET}
      - SERVICE_ID=telegram-service
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
    networks:
      - externa
      - interna
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.huly-telegram-personal.entrypoints=websecure
        - traefik.http.routers.huly-telegram-personal.rule=Host(`${HOST_ADDRESS}`) && PathPrefix(`/_telegram-personal`)
        - traefik.http.routers.huly-telegram-personal.tls=true
        - traefik.http.routers.huly-telegram-personal.tls.certresolver=le
        - traefik.http.routers.huly-telegram-personal.middlewares=huly-strip-telegram-personal
        - traefik.http.middlewares.huly-strip-telegram-personal.stripprefix.prefixes=/_telegram-personal
        - traefik.http.services.huly-telegram-personal.loadbalancer.passHostHeader=true
        - traefik.http.services.huly-telegram-personal.loadbalancer.server.port=8086

