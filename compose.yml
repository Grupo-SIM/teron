services:
  account:
    image: jbmidia/teron_account:latest
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - TRANSACTOR_URL=ws://transactor:3333;wss://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=https://${HOST_ADDRESS}
      - STATS_URL=https://${HOST_ADDRESS}/_stats
      #      - STATS_URL=http://stats:4900
      - MAIL_URL=http://mail:8097
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=https://${HOST_ADDRESS}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
      - SIMINTPAY_API_URL=${SIMINTPAY_API_URL}
      - SIMINTPAY_BILLING_OWNER_ID=${SIMINTPAY_BILLING_OWNER_ID}
      - SIMINTPAY_INTERNAL_TOKEN=${SIMINTPAY_INTERNAL_TOKEN}
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.huly-account.entrypoints=websecure
        - traefik.http.routers.huly-account.rule=Host(`${HOST_ADDRESS}`) && PathPrefix(`/_accounts`)
        - traefik.http.routers.huly-account.tls=true
        - traefik.http.routers.huly-account.tls.certresolver=le
        - traefik.http.routers.huly-account.middlewares=huly-strip-accounts
        - traefik.http.middlewares.huly-strip-accounts.stripprefix.prefixes=/_accounts
        - traefik.http.services.huly-account.loadbalancer.passHostHeader=true
        - traefik.http.services.huly-account.loadbalancer.server.port=3000

