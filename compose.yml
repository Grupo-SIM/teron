  transactor:
    image: jbmidia/teron_transactor:latest
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=https://${HOST_ADDRESS}
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - PULSE_URL=http://hulypulse:8099
      - MAIL_URL=http://mail:8097
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.huly-transactor.entrypoints=websecure
        - traefik.http.routers.huly-transactor.rule=Host(`${HOST_ADDRESS}`) && PathPrefix(`/_transactor`)
        - traefik.http.routers.huly-transactor.tls=true
        - traefik.http.routers.huly-transactor.tls.certresolver=le
        - traefik.http.routers.huly-transactor.middlewares=huly-strip-transactor
        - traefik.http.middlewares.huly-strip-transactor.stripprefix.prefixes=/_transactor
        - traefik.http.routers.huly-transactor-token.entrypoints=websecure
        - traefik.http.routers.huly-transactor-token.rule=Host(`${HOST_ADDRESS}`) && PathPrefix(`/eyJ`)
        - traefik.http.routers.huly-transactor-token.tls=true
        - traefik.http.routers.huly-transactor-token.tls.certresolver=le
        - traefik.http.routers.huly-transactor-token.service=huly-transactor
        - traefik.http.services.huly-transactor.loadbalancer.passHostHeader=true
        - traefik.http.services.huly-transactor.loadbalancer.server.port=3333

  workspace:
    image: jbmidia/teron_workspace:latest
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - TRANSACTOR_URL=ws://transactor:3333;wss://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=${CR_DB_URL}
    networks:
      - interna
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
networks:
  externa:
    external: true
  interna:
    external: true

volumes:
  # These named volumes are used when custom volume paths are not specified
  # If VOLUME_*_PATH variables are set, these volumes will be ignored
  elastic:
  files:
  cr_data:
  cr_certs:
  redpanda:
  mongodb:
