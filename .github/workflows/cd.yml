name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  INIT_SCRIPTS_BRANCH: main

jobs:
  prepare:
    name: Prepare Docker build contexts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Restore Rush and pnpm cache
        id: rush-dependencies-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            common/temp/install-run
            common/temp/pnpm-store
          key: ${{ runner.os }}-rush-dependencies-${{ hashFiles('.nvmrc', 'rush.json', 'common/config/rush/pnpm-lock.yaml', 'common/config/rush/pnpm-config.json') }}

      - name: Install root workspace dependencies
        run: node common/scripts/install-run-rush.js install

      - name: Save Rush and pnpm cache
        if: steps.rush-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            common/temp/install-run
            common/temp/pnpm-store
          key: ${{ steps.rush-dependencies-cache.outputs.cache-primary-key }}

      - name: Restore Rush build cache
        id: rush-build-cache
        uses: actions/cache/restore@v5
        with:
          path: common/temp/build-cache
          key: ${{ runner.os }}-rush-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-rush-build-${{ github.sha }}-
            ${{ runner.os }}-rush-build-

      - name: Set model version
        run: node common/scripts/install-run-rush.js model-version

      - name: Build selected projects
        run: |
          targets=(
            @hcengineering/pod-account
            @hcengineering/pod-calendar
            @hcengineering/pod-collaborator
            @hcengineering/pod-front
            @hcengineering/pod-fulltext
            @hcengineering/pod-gmail
            @hcengineering/pod-love
            @hcengineering/pod-mail
            @hcengineering/pod-notification
            @hcengineering/pod-print
            @hcengineering/rekoni-service
            @hcengineering/pod-stats
            @hcengineering/pod-telegram
            @hcengineering/pod-server
            @hcengineering/pod-workspace
            @hcengineering/prod
          )
          selectors=()

          for target in "${targets[@]}"; do
            selectors+=(--to "$target")
          done

          node common/scripts/install-run-rush.js build -v "${selectors[@]}"

      - name: Bundle selected container packages
        run: |
          targets=(
            @hcengineering/pod-account
            @hcengineering/pod-calendar
            @hcengineering/pod-collaborator
            @hcengineering/pod-front
            @hcengineering/pod-fulltext
            @hcengineering/pod-gmail
            @hcengineering/pod-love
            @hcengineering/pod-mail
            @hcengineering/pod-notification
            @hcengineering/pod-print
            @hcengineering/rekoni-service
            @hcengineering/pod-stats
            @hcengineering/pod-telegram
            @hcengineering/pod-server
            @hcengineering/pod-workspace
          )
          selectors=()

          for target in "${targets[@]}"; do
            selectors+=(--only "$target")
          done

          node common/scripts/install-run-rush.js bundle -v "${selectors[@]}"

      - name: Package frontend assets
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node common/scripts/install-run-rush.js package -v --only @hcengineering/prod
          node common/scripts/install-run-rush.js package -v --only @hcengineering/pod-front

      - name: Save Rush build cache
        if: always() && steps.rush-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: common/temp/build-cache
          key: ${{ steps.rush-build-cache.outputs.cache-primary-key }}

      - name: Download workspace initialization scripts
        run: |
          curl --fail --location --output init.zip \
            "https://github.com/hcengineering/init/archive/refs/heads/${INIT_SCRIPTS_BRANCH}.zip"
          unzip -q init.zip -d pods/workspace
          mv "pods/workspace/init-${INIT_SCRIPTS_BRANCH}" pods/workspace/init

      - name: Stage generated Docker context files
        run: |
          contexts=(
            pods/account
            pods/collaborator
            pods/front
            pods/fulltext
            pods/server
            pods/stats
            pods/workspace
            services/calendar/pod-calendar
            services/gmail/pod-gmail
            services/love
            services/mail/pod-mail
            services/notification/pod-notification
            services/print/pod-print
            services/rekoni
            services/telegram/pod-telegram
          )

          for context in "${contexts[@]}"; do
            for output in bundle dist init lib; do
              if [ -d "$context/$output" ]; then
                mkdir -p "docker-contexts/$context"
                cp -a "$context/$output" "docker-contexts/$context/$output"
              fi
            done
          done

      - name: Archive Docker build contexts
        run: tar -czf docker-build-contexts.tar.gz -C docker-contexts .

      - name: Upload Docker build contexts
        uses: actions/upload-artifact@v7
        with:
          name: docker-build-contexts-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: docker-build-contexts.tar.gz

  publish:
    name: Build and publish ${{ matrix.image }} image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: account
            context: pods/account
          - image: calendar
            context: services/calendar/pod-calendar
          - image: collaborator
            context: pods/collaborator
          - image: front
            context: pods/front
          - image: fulltext
            context: pods/fulltext
          - image: gmail
            context: services/gmail/pod-gmail
          - image: hulypulse
            context: foundations/hulypulse
          - image: love
            context: services/love
          - image: mail
            context: services/mail/pod-mail
          - image: notification
            context: services/notification/pod-notification
          - image: print
            context: services/print/pod-print
          - image: rekoni-service
            context: services/rekoni
          - image: stats
            context: pods/stats
          - image: telegram
            context: services/telegram/pod-telegram
          - image: transactor
            context: pods/server
          - image: workspace
            context: pods/workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Docker build contexts
        uses: actions/download-artifact@v8
        with:
          name: docker-build-contexts-${{ github.sha }}
          path: .artifacts

      - name: Extract Docker build contexts
        run: tar -xzf .artifacts/docker-build-contexts.tar.gz -C .

      - name: Build and publish image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_${{ matrix.image }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.context }}/Dockerfile
          cache-scope: ${{ matrix.image }}
          password: ${{ secrets.GITHUB_TOKEN }}
