name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: true

env:
  DOCKER_CONTEXT_IMAGE: docker.io/jbmidia/teron_workspace:build-context
  INIT_SCRIPTS_BRANCH: main

jobs:
  prepare:
    name: Prepare shared Docker build context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Restore Rush and pnpm cache
        id: rush-dependencies-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            common/temp/install-run
            common/temp/pnpm-store
            common/temp/node_modules
            common/temp/*.flag
            common/temp/*.json
            common/temp/*.yaml
            */node_modules
            */*/node_modules
            */*/*/node_modules
            */*/*/*/node_modules
          key: ${{ runner.os }}-rush-dependencies-${{ hashFiles('.nvmrc') }}-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml', 'common/config/rush/pnpm-config.json', 'common/config/rush/common-versions.json', 'common/config/rush/.pnpmfile.cjs') }}
          restore-keys: |
            ${{ runner.os }}-rush-dependencies-${{ hashFiles('.nvmrc') }}-

      - name: Install root workspace dependencies
        if: steps.rush-dependencies-cache.outputs.cache-hit != 'true'
        run: node common/scripts/install-run-rush.js install

      - name: Save Rush and pnpm cache
        if: steps.rush-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            common/temp/install-run
            common/temp/pnpm-store
            common/temp/node_modules
            common/temp/*.flag
            common/temp/*.json
            common/temp/*.yaml
            */node_modules
            */*/node_modules
            */*/*/node_modules
            */*/*/*/node_modules
          key: ${{ steps.rush-dependencies-cache.outputs.cache-primary-key }}

      - name: Restore Rush build cache
        id: rush-build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            common/temp/build-cache
            dev/prod/.build_dev
          key: ${{ runner.os }}-rush-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-rush-build-${{ github.sha }}-
            ${{ runner.os }}-rush-build-

      - name: Set model version
        run: node common/scripts/install-run-rush.js model-version

      - name: Build selected projects
        run: |
          targets=(
            @hcengineering/pod-account
            @hcengineering/pod-collaborator
            @hcengineering/pod-front
            @hcengineering/pod-fulltext
            @hcengineering/pod-github
            @hcengineering/pod-love
            @hcengineering/pod-mail
            @hcengineering/pod-notification
            @hcengineering/pod-print
            @hcengineering/rekoni-service
            @hcengineering/pod-stats
            @hcengineering/pod-server
            @hcengineering/pod-workspace
            @hcengineering/prod
          )
          selectors=()

          for target in "${targets[@]}"; do
            selectors+=(--to "$target")
          done

          node common/scripts/install-run-rush.js build -v "${selectors[@]}"

      - name: Bundle selected container packages
        run: |
          targets=(
            @hcengineering/pod-account
            @hcengineering/pod-collaborator
            @hcengineering/pod-front
            @hcengineering/pod-fulltext
            @hcengineering/pod-github
            @hcengineering/pod-love
            @hcengineering/pod-mail
            @hcengineering/pod-notification
            @hcengineering/pod-print
            @hcengineering/rekoni-service
            @hcengineering/pod-stats
            @hcengineering/pod-server
            @hcengineering/pod-workspace
          )
          selectors=()

          for target in "${targets[@]}"; do
            selectors+=(--only "$target")
          done

          node common/scripts/install-run-rush.js bundle -v "${selectors[@]}"

      - name: Package frontend assets
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          USE_CACHE: "true"
        run: node common/scripts/install-run-rush.js package -v --only @hcengineering/prod --only @hcengineering/pod-front

      - name: Save Rush build cache
        if: always() && steps.rush-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            common/temp/build-cache
            dev/prod/.build_dev
          key: ${{ steps.rush-build-cache.outputs.cache-primary-key }}

      - name: Download workspace initialization scripts
        run: |
          curl --fail --location --output init.zip \
            "https://github.com/hcengineering/init/archive/refs/heads/${INIT_SCRIPTS_BRANCH}.zip"
          unzip -q init.zip -d pods/workspace
          mv "pods/workspace/init-${INIT_SCRIPTS_BRANCH}" pods/workspace/init

      - name: Stage generated Docker context files
        run: |
          contexts=(
            pods/account
            pods/collaborator
            pods/front
            pods/fulltext
            pods/server
            pods/stats
            pods/workspace
            services/github/pod-github
            services/love
            services/mail/pod-mail
            services/notification/pod-notification
            services/print/pod-print
            services/rekoni
          )

          for context in "${contexts[@]}"; do
            for output in bundle dist init lib; do
              if [ -d "$context/$output" ]; then
                mkdir -p "docker-contexts/$context"
                cp -a "$context/$output" "docker-contexts/$context/$output"
              fi
            done
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Push shared Docker build context
        run: |
          docker build --tag "$DOCKER_CONTEXT_IMAGE" --file - docker-contexts <<'DOCKERFILE'
          FROM alpine:3.21
          COPY . /docker-contexts
          DOCKERFILE
          docker push "$DOCKER_CONTEXT_IMAGE"

  publish:
    name: Build and publish ${{ matrix.image }} image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: account
            context: pods/account
            build-args: TERON_WORKSPACE_SEAT_AMOUNT=${{ vars.TERON_WORKSPACE_SEAT_AMOUNT || '9.99' }}
          - image: collaborator
            context: pods/collaborator
          - image: front
            context: pods/front
            build-args: TERON_WORKSPACE_SEAT_AMOUNT=${{ vars.TERON_WORKSPACE_SEAT_AMOUNT || '9.99' }}
          - image: fulltext
            context: pods/fulltext
          - image: github
            context: services/github/pod-github
          - image: love
            context: services/love
          - image: mail
            context: services/mail/pod-mail
          - image: notification
            context: services/notification/pod-notification
          - image: print
            context: services/print/pod-print
          - image: rekoni-service
            context: services/rekoni
          - image: stats
            context: pods/stats
          - image: transactor
            context: pods/server
          - image: workspace
            context: pods/workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Restore shared Docker build context
        run: |
          docker pull "$DOCKER_CONTEXT_IMAGE"
          context_container=$(docker create "$DOCKER_CONTEXT_IMAGE")
          trap 'docker rm -f "$context_container"' EXIT
          docker cp "${context_container}:/docker-contexts/." .

      - name: Build and publish image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: jbmidia/teron_${{ matrix.image }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.context }}/Dockerfile
          build-args: ${{ matrix.build-args }}
          cache-scope: ${{ matrix.image }}
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

  publish-hulypulse:
    name: Build and publish hulypulse image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and publish image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: jbmidia/teron_hulypulse
          context: foundations/hulypulse
          dockerfile: foundations/hulypulse/Dockerfile
          cache-scope: hulypulse
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
