name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  INIT_SCRIPTS_BRANCH: main

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Restore Rush and pnpm cache
        id: rush-dependencies-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            common/temp/install-run
            common/temp/pnpm-store
            common/temp/node_modules
            common/temp/*.flag
            common/temp/*.json
            common/temp/*.yaml
            */node_modules
            */*/node_modules
            */*/*/node_modules
            */*/*/*/node_modules
          key: ${{ runner.os }}-rush-dependencies-${{ hashFiles('.nvmrc') }}-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml', 'common/config/rush/pnpm-config.json', 'common/config/rush/common-versions.json', 'common/config/rush/.pnpmfile.cjs') }}
          restore-keys: |
            ${{ runner.os }}-rush-dependencies-${{ hashFiles('.nvmrc') }}-

      - name: Install root workspace dependencies
        if: steps.rush-dependencies-cache.outputs.cache-hit != 'true'
        run: node common/scripts/install-run-rush.js install

      - name: Save Rush and pnpm cache
        if: steps.rush-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            common/temp/install-run
            common/temp/pnpm-store
            common/temp/node_modules
            common/temp/*.flag
            common/temp/*.json
            common/temp/*.yaml
            */node_modules
            */*/node_modules
            */*/*/node_modules
            */*/*/*/node_modules
          key: ${{ steps.rush-dependencies-cache.outputs.cache-primary-key }}

      - name: Restore Rush build cache
        id: rush-build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            common/temp/build-cache
            dev/prod/.build_dev
          key: ${{ runner.os }}-rush-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-rush-build-${{ github.sha }}-
            ${{ runner.os }}-rush-build-

      - name: Set model version
        run: node common/scripts/install-run-rush.js model-version

      - name: Build selected projects
        run: |
          targets=(
            @hcengineering/pod-account
            @hcengineering/pod-collaborator
            @hcengineering/pod-front
            @hcengineering/pod-fulltext
            @hcengineering/pod-github
            @hcengineering/pod-love
            @hcengineering/pod-mail
            @hcengineering/pod-notification
            @hcengineering/pod-print
            @hcengineering/rekoni-service
            @hcengineering/pod-stats
            @hcengineering/pod-server
            @hcengineering/pod-workspace
            @hcengineering/prod
          )
          selectors=()

          for target in "${targets[@]}"; do
            selectors+=(--to "$target")
          done

          node common/scripts/install-run-rush.js build -v "${selectors[@]}"

      - name: Bundle selected container packages
        run: |
          targets=(
            @hcengineering/pod-account
            @hcengineering/pod-collaborator
            @hcengineering/pod-front
            @hcengineering/pod-fulltext
            @hcengineering/pod-github
            @hcengineering/pod-love
            @hcengineering/pod-mail
            @hcengineering/pod-notification
            @hcengineering/pod-print
            @hcengineering/rekoni-service
            @hcengineering/pod-stats
            @hcengineering/pod-server
            @hcengineering/pod-workspace
          )
          selectors=()

          for target in "${targets[@]}"; do
            selectors+=(--only "$target")
          done

          node common/scripts/install-run-rush.js bundle -v "${selectors[@]}"

      - name: Package frontend assets
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          USE_CACHE: "true"
        run: node common/scripts/install-run-rush.js package -v --only @hcengineering/prod --only @hcengineering/pod-front

      - name: Save Rush build cache
        if: always() && steps.rush-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            common/temp/build-cache
            dev/prod/.build_dev
          key: ${{ steps.rush-build-cache.outputs.cache-primary-key }}

      - name: Download workspace initialization scripts
        run: |
          curl --fail --location --output init.zip \
            "https://github.com/hcengineering/init/archive/refs/heads/${INIT_SCRIPTS_BRANCH}.zip"
          unzip -q init.zip -d pods/workspace
          mv "pods/workspace/init-${INIT_SCRIPTS_BRANCH}" pods/workspace/init

      - name: Build and publish account image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_account
          context: pods/account
          dockerfile: pods/account/Dockerfile
          cache-scope: account
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish collaborator image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_collaborator
          context: pods/collaborator
          dockerfile: pods/collaborator/Dockerfile
          cache-scope: collaborator
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish front image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_front
          context: pods/front
          dockerfile: pods/front/Dockerfile
          cache-scope: front
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish fulltext image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_fulltext
          context: pods/fulltext
          dockerfile: pods/fulltext/Dockerfile
          cache-scope: fulltext
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish github image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_github
          context: services/github/pod-github
          dockerfile: services/github/pod-github/Dockerfile
          cache-scope: github
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish love image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_love
          context: services/love
          dockerfile: services/love/Dockerfile
          cache-scope: love
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish mail image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_mail
          context: services/mail/pod-mail
          dockerfile: services/mail/pod-mail/Dockerfile
          cache-scope: mail
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish notification image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_notification
          context: services/notification/pod-notification
          dockerfile: services/notification/pod-notification/Dockerfile
          cache-scope: notification
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish print image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_print
          context: services/print/pod-print
          dockerfile: services/print/pod-print/Dockerfile
          cache-scope: print
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish rekoni-service image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_rekoni-service
          context: services/rekoni
          dockerfile: services/rekoni/Dockerfile
          cache-scope: rekoni-service
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish stats image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_stats
          context: pods/stats
          dockerfile: pods/stats/Dockerfile
          cache-scope: stats
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish transactor image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_transactor
          context: pods/server
          dockerfile: pods/server/Dockerfile
          cache-scope: transactor
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and publish workspace image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_workspace
          context: pods/workspace
          dockerfile: pods/workspace/Dockerfile
          cache-scope: workspace
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

  publish-hulypulse:
    name: Build and publish hulypulse image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and publish image
        uses: hyoretsu/gh-actions/ghcr@main
        with:
          image: ${{ github.repository }}_hulypulse
          context: foundations/hulypulse
          dockerfile: foundations/hulypulse/Dockerfile
          cache-scope: hulypulse
          registry: docker.io
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
